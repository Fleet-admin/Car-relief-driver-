<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function() {
        // Check if launching as a standalone PWA (installed WebAPK on Android)
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        
        if (isStandalone) {
          // Dynamic viewport normalization function to bypass Chrome's origin-specific "Desktop Site" setting
          function enforceNativeViewport() {
            var existingViewports = document.querySelectorAll('meta[name="viewport"]');
            existingViewports.forEach(function(el) {
              el.remove();
            });
            
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover';
            document.head.appendChild(meta);
          }
          
          enforceNativeViewport();
          
          // Re-trigger viewport check on DOM content loaded and window load to prevent late overrides
          window.addEventListener('DOMContentLoaded', enforceNativeViewport);
          window.addEventListener('load', enforceNativeViewport);
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#111827" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Standard Favicons and Apple Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="/icon-512x512.png" />
    
    <!-- Primary Display Typography Fonts Setup -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title>Car & Driver Relief Services | Core Fleet & Chauffeur Logistics</title>
  </head>
  <body class="bg-neutral-50 text-neutral-900 select-none antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Clean up and ensure service workers are unregistered to prevent static caching issues -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const registration of registrations) {
            registration.unregister().then((success) => {
              if (success) {
                console.log('Successfully unregistered active service worker to prevent caching issues.');
              }
            });
          }
        }).catch((err) => {
          console.error('Error unregistering service worker:', err);
        });
      }
    </script>
  </body>
</html>
