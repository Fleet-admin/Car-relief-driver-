<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Primary Display Typography Fonts Setup -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title>Car & Driver Relief Services | Core Fleet & Chauffeur Logistics</title>

  <body class="bg-neutral-50 text-neutral-900 select-none antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Clean up and ensure service workers are unregistered to prevent static caching issues -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const registration of registrations) {
            registration.unregister().then((success) => {
              if (success) {
                console.log('Successfully unregistered active service worker to prevent caching issues.');
              }
            });
          }
        }).catch((err) => {
          console.error('Error unregistering service worker:', err);
        });
      }
    </script>
  </body>
</html>
