<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function() {
        // Check if launching as a standalone PWA (installed WebAPK on Android)
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        
        if (isStandalone) {
          // Dynamic viewport normalization function to bypass Chrome's origin-specific "Desktop Site" setting
          function enforceNativeViewport() {
            var existingViewports = document.querySelectorAll('meta[name="viewport"]');
            existingViewports.forEach(function(el) {
              el.remove();
            });
            
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover';
            document.head.appendChild(meta);
          }
          
          enforceNativeViewport();
          
          // Re-trigger viewport check on DOM content loaded and window load to prevent late overrides
          window.addEventListener('DOMContentLoaded', enforceNativeViewport);
          window.addEventListener('load', enforceNativeViewport);
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#111827" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Standard Favicons and Apple Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="/icon-512x512.png" />
    
    <!-- Primary Display Typography Fonts Setup -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title>Car & Driver Relief Services | Core Fleet & Chauffeur Logistics</title>
  </head>
  <body class="bg-neutral-50 text-neutral-900 select-none antialiased">
    <!-- Premium PWA / Native-feel Splash Screen -->
    <div id="pwa-splash-screen" style="position: fixed; inset: 0; background-color: #111827; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100000; transition: opacity 0.5s ease-out, visibility 0.5s ease-out; font-family: 'Space Grotesk', -apple-system, sans-serif;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 1.5rem; text-align: center;">
        <img src="/icon.svg" alt="Car & Driver Relief Services" style="width: 120px; height: 120px; object-fit: contain; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); animation: pulseFloat 2.5s ease-in-out infinite;" />
        <div>
          <h1 style="color: #ffffff; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; margin: 0; text-transform: uppercase;">Car & Driver</h1>
          <span style="color: #9ca3af; font-size: 0.75rem; font-family: monospace; letter-spacing: 0.2em; display: block; margin-top: 0.25rem; font-weight: bold; text-transform: uppercase;">Relief Services</span>
        </div>
      </div>
      <style>
        @keyframes pulseFloat {
          0%, 100% { transform: translateY(0) scale(1); }
          50% { transform: translateY(-8px) scale(1.02); }
        }
      </style>
    </div>

    <script>
      (function() {
        function removeSplashScreen() {
          var splash = document.getElementById('pwa-splash-screen');
          if (splash) {
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            setTimeout(function() {
              if (splash.parentNode) {
                splash.parentNode.removeChild(splash);
              }
            }, 600);
          }
        }
        
        // Remove after full load with a clean minimum duration buffer for visual delight
        window.addEventListener('load', function() {
          setTimeout(removeSplashScreen, 400);
        });
        
        // Safety fallback if load event is missed
        setTimeout(removeSplashScreen, 3000);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Register Progressive Web App (PWA) Service Worker for full off-line resiliency -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('PWA ServiceWorker successfully registered with scope: ', registration.scope);
            })
            .catch(function(err) {
              console.error('PWA ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
  </body>
</html>
